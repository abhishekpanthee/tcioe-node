name: Notify

on:
  push:
  create:
  delete:
  pull_request:

jobs:
  discord-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord Webhook
        env:
          WEBHOOK_URL: https://discord.com/api/webhooks/1395040633781227581/RRMTPOrejehaqOupmTN2qGjFdgZqT5ZlpsjY0wkKBB8vNYV_2hjNNnbTgtfWCMJQF_eR
          BOT_AVATAR: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
          BOT_NAME: "GitHub Actions 🚀"
        run: |
          EVENT="${{ github.event_name }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          REF="${{ github.ref }}"
          SHA="${{ github.sha }}"
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ACTOR_AVATAR="https://github.com/${ACTOR}.png"

          # fallback if git fails
          COMMIT_MSG=$(git log -1 --pretty=%B || echo "${{ github.event.head_commit.message }}")
          COMMIT_DATE=$(git log -1 --pretty=%cd --date=iso-strict || echo "${TS}")
          FILES_MODIFIED=$(git diff-tree --no-commit-id --name-only -r $SHA | paste -sd ', ' - || echo "Unavailable")

          TITLE="GitHub Event: ${EVENT}"

          if [ "$EVENT" == "push" ]; then
            COLOR=3066993
            DESCRIPTION="**Commit Message:** ${COMMIT_MSG}\n\n**Commit ID:** [\`${SHA::7}\`](https://github.com/${REPO}/commit/${SHA})  \n**Branch:** \`${REF#refs/heads/}\`\n\n**Files Modified:** ${FILES_MODIFIED}\n\n**Commit Date:** ${COMMIT_DATE}\n\n**Repository:** [${REPO}](https://github.com/${REPO})\n**Repository Owner:** [${ACTOR}](https://github.com/${ACTOR})"
          elif [ "$EVENT" == "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            COLOR=3447003
            DESCRIPTION="**PR:** [#${PR_NUMBER} ${PR_TITLE}](https://github.com/${REPO}/pull/${PR_NUMBER})\n**By:** [${ACTOR}](https://github.com/${ACTOR})"
          elif [ "$EVENT" == "create" ]; then
            COLOR=10181046
            DESCRIPTION="**${GITHUB_EVENT_REF_TYPE:-Branch} Name:** \`${REF#refs/heads/}\`\n**By:** [${ACTOR}](https://github.com/${ACTOR})"
          elif [ "$EVENT" == "delete" ]; then
            COLOR=15158332
            DESCRIPTION="**${GITHUB_EVENT_REF_TYPE:-Branch} Name:** \`${REF#refs/heads/}\`\n**By:** [${ACTOR}](https://github.com/${ACTOR})"
          else
            COLOR=0
            DESCRIPTION="An unknown event occurred in $REPO by [${ACTOR}](https://github.com/${ACTOR})"
          fi

          PAYLOAD=$(jq -n \
            --arg username "$BOT_NAME" \
            --arg avatar_url "$BOT_AVATAR" \
            --arg author_name "$ACTOR" \
            --arg author_icon "$ACTOR_AVATAR" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg color "$COLOR" \
            --arg timestamp "$TS" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                color: ($color | tonumber),
                timestamp: $timestamp,
                author: {
                  name: $author_name,
                  url: ("https://github.com/" + $author_name),
                  icon_url: $author_icon
                },
                footer: {
                  text: "Repository Owner: " + $author_name
                }
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL"
